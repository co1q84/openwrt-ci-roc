name: x86-64-ImmortalWrt

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: x86-64-firmware
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  OPENWRT_PATH: /mnt/openwrt
  TZ: Asia/Shanghai
  ROC_TARGET: x86-64

jobs:
  Build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify build and upgrade guards
        run: |
          python3 -m unittest discover -s tests -v
          sh -n files/x86/usr/sbin/roc-update

      - name: Prepare runner storage
        uses: sbwml/actions@free-disk
        with:
          build-mount-path: /mnt/openwrt

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-pyelftools python3-setuptools rsync swig unzip zlib1g-dev file wget curl jq zstd libelf-dev autoconf automake libtool help2man patch perl pkgconf uuid-dev genisoimage bzip2 xz-utils
          sudo chown "$(id -u):$(id -g)" "$OPENWRT_PATH"

      - name: Resolve latest sources and freeze this build
        run: |
          python3 scripts/x86-build.py prepare "$OPENWRT_PATH"
          cat "$OPENWRT_PATH/sources.lock.json"
          echo "RELEASE_TAG=x86-64-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Resolve configuration and reject lost features
        run: |
          make -C "$OPENWRT_PATH" defconfig
          python3 scripts/x86-build.py check-config "$OPENWRT_PATH"
          cp "$OPENWRT_PATH/.config" "$OPENWRT_PATH/requested-final.config"

      - name: Restore download and compiler cache
        uses: actions/cache@v4
        with:
          path: |
            /mnt/openwrt/dl
            /mnt/openwrt/.ccache
          key: x86-64-downloads-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: x86-64-downloads-

      - name: Download sources
        run: make -C "$OPENWRT_PATH" download -j8

      - name: Build firmware
        run: |
          make -C "$OPENWRT_PATH" -j"$(nproc)" || make -C "$OPENWRT_PATH" -j1 V=s
          python3 scripts/x86-build.py check-config "$OPENWRT_PATH"

      - name: Verify and package immutable release
        run: |
          python3 scripts/x86-build.py release "$OPENWRT_PATH" --output "$GITHUB_WORKSPACE/release" --tag "$RELEASE_TAG"
          cd release
          sha256sum -c sha256sums

      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x86-build-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /mnt/openwrt/.config
            /mnt/openwrt/sources.lock.json
            /mnt/openwrt/logs
            /mnt/openwrt/tmp/.config-package.in
            /mnt/openwrt/tmp/.packageinfo
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true

      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('release/release.json').read_text())
          Path('release-notes.md').write_text(
              f"x86/64 · J4125-4L · UEFI · squashfs · boot 64 MiB / root 960 MiB\n\n"
              f"Kernel: {m['kernel']}\n\n"
              "This build resolves the latest configured source and plugin heads. Exact commits, final config, package manifest, offline APKs and SHA256 are attached.\n\n"
              "Keep device configuration private. Download roc-update to the router and run it from SSH or the existing LuCI terminal. Check, back up and confirm manually; no unattended flashing.\n\n"
              "Built and checked in CI; router boot and service acceptance require a separately confirmed upgrade.\n")
          PY
          gh release create "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes-file release-notes.md --draft
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
